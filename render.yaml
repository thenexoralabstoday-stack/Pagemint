# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service serves both the app and its API, so no cross-origin setup is needed.
services:
  - type: web
    name: pagemint
    runtime: node
    plan: free
    buildCommand: npm install --prefix server --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SESSION_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: STRIPE_PRICE_PRO_WEEKLY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_TO
        value: thenexoralabstoday@gmail.com
      - key: ANTHROPIC_API_KEY
        sync: false
